name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Prepare static site
        run: |
          mkdir -p site
          cp index.html site/index.html
          cp alchemy.html site/alchemy.html
          cp alchemy-engine.js site/alchemy-engine.js
          cp alchemy-sequence.js site/alchemy-sequence.js
          cp alchemy-ui.js site/alchemy-ui.js
          cp chromatic-warp.js site/chromatic-warp.js
          cp vj-lab.js site/vj-lab.js
          cp deck-mixer.js site/deck-mixer.js
          cp geometry-lab.js site/geometry-lab.js
          cp performance-cues.js site/performance-cues.js
          cp performance-timeline.js site/performance-timeline.js
          cp scene-dissolve.js site/scene-dissolve.js
          # Fail deployment before upload if any linked alchemical asset is missing.
          for file in alchemy.html alchemy-engine.js alchemy-sequence.js alchemy-ui.js; do
            test -s "site/$file" || { echo "Missing Pages artifact: $file"; exit 1; }
          done
          touch site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
