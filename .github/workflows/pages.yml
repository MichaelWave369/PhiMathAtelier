name: Deploy GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare static site
        run: |
          mkdir -p site
          # Deploy all root-level HTML and JavaScript modules together,
          # so new labs cannot be linked but omitted from Pages.
          cp -- ./*.html ./*.js site/
          touch site/.nojekyll
          node tests/pages-assets.mjs site
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
