name: Smoke checks
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source, controls, and JavaScript
        run: |
          node tests/smoke.mjs
          node tests/vj-lab.mjs
          node tests/deck-mixer.mjs
